<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This document is a basic web page set up as a music chart -->
    <title>My Tune</title>

    <meta charset="utf-8" />
    <meta name="author" content="" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width" />

    <script type="importmap">{
        "imports": {
            "bolt/":     "/bolt/",
            "dom/":      "/dom/modules/",
            "fn/":       "/fn/modules/",
            "midi/":     "/midi/modules/",
            "neuron/":   "/neuron/",
            "sequence/": "/sequence/"
        }
    }</script>

    <!-- Import <scribe-music> -->
    <link rel="stylesheet" href="./scribe-music/element.css" />
    <script type="module" src="./scribe-music/element.js"></script>

    <!-- CSS Style rules -->
    <style>
        @import './build/scribe-music/element.css';

        * {
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 1em 1.5em;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        header {
            font-family: JazzText, cursive;
            display: grid;
            grid-template-columns: [part] auto [title] 1fr [credits] auto;
            align-items: last baseline;
        }

        header > * {
            margin: 0;
            grid-row: 1;
        }

        header > .title {
            font-size: 3em;
            grid-column: title;
            justify-self: center;
            text-align: center;
        }

        header > .part {
            grid-column: part;
            justify-self: start;
            text-align: left;
        }

        header > .credit {
            grid-column: credit;
            justify-self: end;
            text-align: right;
        }

        footer {
            font-size: 0.625em;
            margin-top: auto;
        }

        a {
            color: oklch(0.6 0.27 1.54);
            text-decoration: none;
        }

        /* For a more classic look... */
        /*@import 'https://cdn.jsdelivr.net/gh/stephband/scribe@0.6.x/build/fonts/bravura.css';

        header {
          font-family: BravuraText, serif;
        }

        scribe-music {
          font-family: Bravura, BravuraText;
        }*/
    </style>
</head>
<body>
    <header>
        <h1 class="title">My Tune</h1>
        <p class="part">Piano</p>
        <p class="credit">Composed by My Name</p>
    </header>

    <h2>B♭</h2><scribe-music staff="treble" src="./data/training/chords/Bb.sequence"></scribe-music>
    <h2>F</h2><scribe-music staff="treble" src="./data/training/chords/F.sequence"></scribe-music>
    <h2>C</h2><scribe-music staff="treble" src="./data/training/chords/C.sequence"></scribe-music>
    <h2>G</h2><scribe-music staff="treble" src="./data/training/chords/G.sequence"></scribe-music>
    <h2>D</h2><scribe-music staff="treble" src="./data/training/chords/D.sequence"></scribe-music>
    <h2>A</h2><scribe-music staff="treble" src="./data/training/chords/A.sequence"></scribe-music>
    <h2>E</h2><scribe-music staff="treble" src="./data/training/chords/E.sequence"></scribe-music>
    <h2>B</h2><scribe-music staff="treble" src="./data/training/chords/B.sequence"></scribe-music>

    <footer>
        <p>&copy;2025 My Name. <a href="https://stephen.band/scribe/">Scribe</a> by Stephen Band.</p>
    </footer>
</body>
</html>
