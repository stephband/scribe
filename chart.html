<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This document is a basic web page set up as a music chart -->
    <title>My Tune</title>

    <meta charset="utf-8" />
    <meta name="author" content="" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width" />

    <script type="importmap">{
        "imports": {
            "bolt/":     "/bolt/",
            "dom/":      "/dom/modules/",
            "fn/":       "/fn/modules/",
            "midi/":     "/midi/modules/",
            "neuron/":   "/neuron/",
            "sequence/": "/sequence/"
        }
    }</script>

    <!-- Import <scribe-music> -->
    <link rel="stylesheet" href="./scribe-music/element.css" />
    <script type="module" src="./scribe-music/element.js"></script>

    <!-- CSS Style rules -->
    <style>
    @import 'https://cdn.jsdelivr.net/gh/stephband/bolt-2@1.x/classes/atoms.css';
    @import './module.css';

    * {
        box-sizing: border-box;
    }

    html {
        height: 100%;
    }

    body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1em 1.5em 0.5em;
        min-height: 100%;
        display: flex;
        flex-direction: column;

        --selection-fg: oklch(0.64 0.15 203.61);
        --zone-duration: 0.5;
    }

    body > footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 2;
    }

    header {
        font-family: JazzText, cursive;
        display: grid;
        grid-template-columns: [part] auto [title] 1fr [credits] auto;
        align-items: last baseline;
    }

    header > * {
        margin: 0;
        grid-row: 1;
    }

    header > .title {
        font-size: 3em;
        grid-column: title;
        justify-self: center;
        text-align: center;
    }

    header > .part {
        grid-column: part;
        justify-self: start;
        text-align: left;
    }

    header > .credit {
        grid-column: credit;
        justify-self: end;
        text-align: right;
    }

    footer {
        font-size: 0.625em;
        margin-top: auto;
        padding-bottom: 0.5em;
        background-color: white;
    }

    a {
        color: oklch(0.6 0.27 1.54);
        text-decoration: none;
    }

    .highlight {
        color: red;
        font-weight: bold;
    }

    /* For a more classic look... */
    /*@import 'https://cdn.jsdelivr.net/gh/stephband/scribe@0.4.x/build/fonts/bravura.css';

    header {
      font-family: BravuraText, serif;
    }

    scribe-music {
      font-family: Bravura, BravuraText;
    }*/
    </style>

    <script type="module">
        function update() {
            const params = new URLSearchParams(window.location.search);
            const src    = params.get('sequence');

            if (!src) return;

            const music  = document.getElementById('music');
            const title  = document.getElementById('title');

            if (src && music.src !== src) music.src = src;

            const grep = /\/([\w\s-]+)\.\w+$/.exec(src);
            title.textContent = grep[1];

            setTimeout(() => {
                const sequence = music.data;
            }, 300);
        }

        // Browser navigation & URL changes
        window.addEventListener('popstate', update);
        window.addEventListener('hashchange', update);

        if (window.navigation) {
            window.navigation.addEventListener('currententrychange', update);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', update);
        }
        else {
            update();
        }


        import { KEYNAMES } from 'sequence/modules/event/key.js';
        import { fifths } from './modules/spell/circle.js';
        import { toKeyCentre, toDorianCentre } from './modules/spell/to-key.js';
        let highlighted;

        const { PI, cos, sin } = Math;
        const deg30 = PI / 6;
        const SCREEN_OFFSET = -5 * deg30;
        const FIFTH_LABELS = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯/G♭', 'C♯/D♭', 'A♭/G♯', 'E♭/D♯', 'B♭', 'F'];

        function toScreen(a, r, cx, cy, scale) {
            const sa = a + SCREEN_OFFSET;
            return [cx + r * scale * cos(sa), cy + r * scale * sin(sa)];
        }

        function drawArrow(ctx, cx, cy, a, r, scale, color, width = 2.5, dashed = false) {
            const [x2, y2] = toScreen(a, r, cx, cy, scale);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            if (dashed) ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            if (r * scale > 8) {
                const sa = a + SCREEN_OFFSET;
                const head = 8;
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - head * cos(sa - 0.35), y2 - head * sin(sa - 0.35));
                ctx.lineTo(x2 - head * cos(sa + 0.35), y2 - head * sin(sa + 0.35));
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function drawVectors(notes, key, debug) {
            const canvas = document.getElementById('spell-canvas');
            const readout = document.getElementById('spell-readout');
            const ctx = canvas.getContext('2d');
            const W = canvas.width;
            const H = canvas.height;
            const cx = W / 2;
            const cy = H / 2;
            const R = 135;

            ctx.clearRect(0, 0, W, H);

            // Light muted rose-red push arc outside the circle from A♭/G♯ (2*deg30 + PI)
            const pushWidth = 4;
            const pushR = R * 1.07;
            const seamA = 2 * deg30 + PI + SCREEN_OFFSET;
            if (Math.abs(debug.push) > 1e-4) {
                ctx.save();
                ctx.strokeStyle = '#cf8a9b';
                ctx.lineWidth = pushWidth;
                ctx.lineCap = 'butt';
                ctx.beginPath();
                ctx.arc(cx, cy, pushR, seamA, seamA + debug.push, debug.push < 0);
                ctx.stroke();
                ctx.restore();
            }

            // Very light grey half-circle centred on input key's dorian centre (orange dot)
            const dorianKeyA = (key + 2) * deg30 + SCREEN_OFFSET;
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
            ctx.beginPath();
            ctx.arc(cx, cy, R, dorianKeyA - PI / 2, dorianKeyA + PI / 2);
            ctx.closePath();
            ctx.fill();

            // Slightly darker grey sector from key centre note to dorian centre note (+60°)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.025)';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, R, key * deg30 + SCREEN_OFFSET, dorianKeyA);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Outer unit circle
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, 2 * PI);
            ctx.stroke();

            // 12 fifths ticks
            const activeFifths = new Set(notes.map(fifths));
            const keyFifth = ((key % 12) + 12) % 12;
            const pushFifths = debug.push / deg30;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let f = 0; f < 12; f++) {
                const a = f * deg30;
                const [tx, ty] = toScreen(a, 1, cx, cy, R);
                const [lx, ly] = toScreen(a, 1.2, cx, cy, R);
                const isHit = activeFifths.has(f);
                const isKey = f === keyFifth;
                const k = f - 12 * Math.round((f - 2 - pushFifths) / 12);
                const label = KEYNAMES[k] ?? FIFTH_LABELS[f];

                ctx.fillStyle = isHit ? '#111' : '#ccc';
                ctx.beginPath();
                ctx.arc(tx, ty, isHit ? 5.5 : isKey ? 5 : 3, 0, 2 * PI);
                ctx.fill();

                ctx.font = isHit ? 'bold 12px system-ui' : '11px system-ui';
                ctx.fillStyle = isHit ? '#111' : '#777';
                ctx.fillText(label, lx, ly);
            }

            // Shaded green sector between dorian result and key result (-60°)
            const radius = debug.radius ?? debug.rotated.r;
            ctx.save();
            ctx.fillStyle = 'rgba(22, 163, 74, 0.14)';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, debug.dorian.r * R, debug.dorian.a + SCREEN_OFFSET, debug.dorian.a - 2 * deg30 + SCREEN_OFFSET, true);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Vectors
            const [rawX, rawY] = toScreen(debug.raw.a, debug.raw.r, cx, cy, R);
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(rawX, rawY);
            ctx.stroke();

            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(rawX, rawY, 5, 0, 2 * PI);
            ctx.fill();

            // Weighted note average point (tipX, tipY) where dorian bias attaches
            const [biasX, biasY] = toScreen(debug.bias.a, debug.bias.r, cx, cy, R);
            const [dorianX, dorianY] = toScreen(debug.dorian.a, debug.dorian.r, cx, cy, R);
            const tipX = dorianX - (biasX - cx);
            const tipY = dorianY - (biasY - cy);

            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(tipX, tipY, 4, 0, 2 * PI);
            ctx.fill();

            // Amber bias line from weighted note average to dorian result + dashed extension with small arrowhead kissing key's dorian centre
            const [biasCircleX, biasCircleY] = toScreen((key + 2) * deg30, 1, cx, cy, R);
            const extDx = biasCircleX - dorianX;
            const extDy = biasCircleY - dorianY;
            const extDist = Math.hypot(extDx, extDy);
            const dorianFifth = ((key + 2) % 12 + 12) % 12;
            const dotGap = (activeFifths.has(dorianFifth) ? 5.5 : dorianFifth === keyFifth ? 5 : 3) + 1.5;
            if (extDist > dotGap + 2) {
                const extA = Math.atan2(extDy, extDx);
                const endX = biasCircleX - dotGap * cos(extA);
                const endY = biasCircleY - dotGap * sin(extA);
                ctx.save();
                ctx.strokeStyle = 'rgba(217, 119, 6, 0.4)';
                ctx.fillStyle = 'rgba(217, 119, 6, 0.5)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(dorianX, dorianY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                if (extDist - dotGap > 6) {
                    const head = 6;
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.moveTo(endX, endY);
                    ctx.lineTo(endX - head * cos(extA - 0.35), endY - head * sin(extA - 0.35));
                    ctx.lineTo(endX - head * cos(extA + 0.35), endY - head * sin(extA + 0.35));
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }

            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(dorianX, dorianY);
            ctx.stroke();

            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.arc(dorianX, dorianY, 4, 0, 2 * PI);
            ctx.fill();

            // Curved green arc from orange dot (dorian) to green dot (key result)
            const arcR = radius * R;
            const startA = debug.dorian.a + SCREEN_OFFSET;
            const endA = startA - 2 * deg30;
            ctx.save();
            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(cx, cy, arcR, startA, endA, true);
            ctx.stroke();
            ctx.restore();

            // Green dot at [debug.radius, debug.angle]
            const [px, py] = toScreen(debug.angle, radius, cx, cy, R);
            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, 2 * PI);
            ctx.fill();

            readout.innerHTML =
                `<thead><tr style="color:#666; text-align:right"><th style="text-align:left"></th><th>fifths</th><th>a</th><th>r</th><th style="text-align:left">key</th></tr></thead>` +
                `<tbody>` +
                `<tr style="color:#2563eb"><td>note average</td><td style="text-align:right">${ (debug.raw.a / deg30).toFixed(2) }</td><td style="text-align:right">${ (debug.raw.a * 180 / PI).toFixed(1) }°</td><td style="text-align:right">${ debug.raw.r.toFixed(3) }</td><td></td></tr>` +
                `<tr style="color:#d97706"><td>dorian bias</td><td style="text-align:right">${ (debug.bias.a / deg30).toFixed(2) }</td><td style="text-align:right">${ (debug.bias.a * 180 / PI).toFixed(1) }°</td><td style="text-align:right">${ debug.bias.r.toFixed(4) }</td><td></td></tr>` +
                `<tr style="color:#16a34a"><td>key</td><td style="text-align:right">${ (debug.angle / deg30).toFixed(2) }</td><td style="text-align:right">${ (debug.angle * 180 / PI).toFixed(1) }°</td><td style="text-align:right">${ radius.toFixed(3) }</td><td>${ debug.key } (${ KEYNAMES[debug.key] })</td></tr>` +
                `<tr style="color:#9f3a54"><td>push</td><td style="text-align:right">${ (debug.push / deg30).toFixed(2) }</td><td style="text-align:right">${ (debug.push * 180 / PI).toFixed(1) }°</td><td style="text-align:right">1.000</td><td></td></tr>` +
                `</tbody>`;
        }

        window.tokey = function(key) {
            const numbers  = Array.from(arguments).slice(1);
            const sequence = go.apply(this, numbers);
            const keyEvent = sequence.create(0, 'key', key);
            const notes = [];
            let event;
            for (event of sequence) if (event.type === 'note') notes.push(event[2]);
            const debug = {};
            const local  = toKeyCentre(notes, keyEvent[2], debug);

            // DOM
            title.textContent = `${ KEYNAMES[local] } (${ local })`;
            if (highlighted) highlighted.classList.remove('highlight');
            highlighted = document.getElementById(`key-${ local }`);
            if (highlighted) highlighted.classList.add('highlight');
            drawVectors(notes, keyEvent[2], debug);

            return KEYNAMES[local];
        };

        window.go = function() {
            const notes    = arguments;
            const sequence = music.data;

            sequence.events.length = 0;
            let n = notes.length;
            while (n--) {
                sequence.create(0, 'note', notes[n], 0.1, 1);
            }

            return sequence;
        }
    </script>
</head>
<body>
    <header>
        <h1 class="title" id="title">Chords data</h1>
        <p class="part"></p>
        <p class="credit"></p>
    </header>

    <scribe-music id="music"></scribe-music>

    <pre style="line-height: 1.5em; font-size: 1.4rem;">
                    <span id="key-2">D</span>
             <span id="key-1">G</span>             <span id="key-3">A</span>

       <span id="key-0">C</span>                         <span id="key-4">E</span>|<span id="key--8">F♭</span>


     <span id="key--1">F</span>              ●              <span id="key-5">B</span>|<span id="key--7">C♭</span>


       <span id="key--2">B♭</span>                        <span id="key-6">F♯</span>|<span id="key--6">G♭</span>

           <span id="key--3">E♭</span>             <span id="key-7">C♯</span>|<span id="key--5">D♭</span>
                  <span id="key-8">G♯</span>|<span id="key--4">A♭</span>
    </pre>

    <div style="display: flex; gap: 1.5rem; align-items: start; flex-wrap: wrap;">
        <canvas id="spell-canvas" width="380" height="380" style="border: 1px solid #ddd; border-radius: 6px;"></canvas>
        <table id="spell-readout" style="font-family: monospace; font-size: 0.85rem; border-collapse: separate; border-spacing: 0.75em 0.35em;"></table>
    </div>
</body>
</html>
