<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A motif with some mojo - Hyperblam × Scribe</title>

    <link rel="stylesheet" href="../element.css" />

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000000;
            color: #e5e9f0;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        p {
            color: #8892b0;
            margin: 0;
            max-width: 600px;
            line-height: 1.5;
        }

        .controls {
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background: #e06c75;
            color: #fff;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        button:hover {
            background: #be5059;
        }

        button:active {
            transform: scale(0.98);
        }

        audio-blam {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 960px;
        }

        scribe-hyperblam {
            box-sizing: border-box;
            width: 100%;
            min-height: 280px;
            background: #ffffff;
            color: #000000;
            border: 0.75em solid white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 1.5rem;
        }
    </style>

    <script type="importmap">{
        "imports": {
            "bolt/":      "https://cdn.jsdelivr.net/gh/stephband/bolt-2@1.0.9/",
            "dom/":       "https://cdn.jsdelivr.net/gh/stephband/dom@1.4.9/modules/",
            "fn/":        "https://cdn.jsdelivr.net/gh/stephband/fn@1.6.8/modules/",
            "midi/":      "https://cdn.jsdelivr.net/gh/stephband/midi@1.1.5/modules/",
            "neuron/":    "https://cdn.jsdelivr.net/gh/stephband/neuron@0.1.1/",
            "sequence/":  "/sequence/",
            "hyperblam/": "https://hyperblam.how/static/hyperblam/dist/hyperblam/"
        }
    }</script>

    <!-- Import ScribeHyperblam and Hyperblam -->
    <script type="module">
        import '../module.js';
        import 'hyperblam/hyperblam.js';

        const clock = document.getElementById('transport');
        const playBtn = document.getElementById('play-btn');

        clock?.addEventListener('blamplay', () => {
            if (playBtn) playBtn.textContent = 'Stop';
        });

        clock?.addEventListener('blamstop', () => {
            if (playBtn) playBtn.textContent = 'Play';
            document.querySelectorAll('note-blam, pad-blam, synth-blam').forEach(s => s.stop?.());
        });

        playBtn?.addEventListener('click', () => {
            clock?.playStop?.();
        });
    </script>
</head>

<body>
    <header>
        <img src="./logo.svg" alt="Hyperblam" width="160" height="76" style="margin-bottom: 1rem;" />
        <h1>A motif with some mojo</h1>
        <p>Real-time multi-part score visualiser</p>
    </header>

    <div class="controls">
        <button type="button" id="play-btn">Play</button>
    </div>

    <audio-blam bpm="100">
        <chain-blam id="bus">
            <analyser-blam id="analyser" smoothing="0.25"></analyser-blam>
        </chain-blam>

        <!-- Bass Sampler with Filter and Relayed Detune Envelopes -->
        <note-blam id="bass" choke="0.02" notes="A1 A1 A1 C2 D2 D#2 E2 G1 A2 C3">
            <bank-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/bass/01.mp3" root="A1"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/bass/02.mp3" root="C#2"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/bass/03.mp3" root="E2"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/bass/04.mp3" root="A2"></sample-blam>
            </bank-blam>
            <blam-blam prop="length" value="0.25|0.5|0.5|0.125|1"></blam-blam>
            <chain-blam out="bus">
                <filter-blam freq="8000" q="15">
                    <envelope-blam prop="freq" curve="100 0, 2500 0.5" beats=""></envelope-blam>
                </filter-blam>
            </chain-blam>
            <relay-blam mode="one" chance="0.333" to="note-blam">
                <envelope-blam to="note-blam" prop="detune" curve="-300 0, 0 0.125" beats="" off=""></envelope-blam>
                <envelope-blam to="note-blam" prop="detune" curve="0 0, 50 0.25, 0 0.5" beats="" off=""></envelope-blam>
            </relay-blam>
        </note-blam>

        <!-- Garage Kit Drum Pads -->
        <pad-blam id="kick" note="36" out="bus" detune="300">
            <bank-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/kick/01.mp3"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/kick/02.mp3"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/kick/03.mp3"></sample-blam>
            </bank-blam>
        </pad-blam>

        <pad-blam id="hat" choke="" out="bus" detune="300">
            <bank-blam>
                <sample-blam note="closed-hi-hat" src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/hat/01.mp3"></sample-blam>
                <sample-blam note="closed-hi-hat" src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/hat/02.mp3"></sample-blam>
                <sample-blam note="open-hi-hat" src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/hat/03.mp3"></sample-blam>
            </bank-blam>
        </pad-blam>

        <pad-blam id="snare" note="38" out="bus" detune="200">
            <bank-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/snare-hard/01.mp3"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/snare-hard/02.mp3"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/snare-hard/03.mp3"></sample-blam>
            </bank-blam>
        </pad-blam>

        <pad-blam id="snareSoft" note="38" out="bus">
            <bank-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/snare-soft/01.mp3"></sample-blam>
                <sample-blam src="https://cdn.jsdelivr.net/gh/Heydon/hyperblam-docs@main/src/static/sounds/kit-garage/snare-soft/02.mp3"></sample-blam>
            </bank-blam>
        </pad-blam>

        <!-- Transport & Tracks -->
        <sequencer-blam id="transport">
            <track-blam id="bassTrack" to="#bass" chance="0.7">
                <repeat-blam x="3">
                    <bar-blam s="A1 0 0 ? 0 ? ? 0"></bar-blam>
                    <bar-blam s="C2 0 ? 0 0 ? ? 0"></bar-blam>
                </repeat-blam>
                <bar-blam s="0 G1 0 ? ? ? ? A2" chance="1"></bar-blam>
            </track-blam>

            <track-blam id="kickTrack" to="#kick" chance="0.5" override="snareSoftTrack">
                <bar-blam s="1 0 0 3 0 2 1 0"></bar-blam>
                <bar-blam s="1 0 1 3 0 2 1 0"></bar-blam>
            </track-blam>

            <track-blam id="hatTrack" to="#hat" chance="0.9">
                <bar-blam s="1 0 2 0 1 ? ? 0 ?"></bar-blam>
                <bar-blam s="1 2 0 0 1 0 ?"></bar-blam>
            </track-blam>

            <track-blam id="snareTrack" to="#snare" override="kickTrack snareSoftTrack" chance="0.9">
                <repeat-blam x="3">
                    <bar-blam s="0 0 0 0 ? 0 0 0"></bar-blam>
                    <bar-blam s="0 0 ? 0 0 0 0 0"></bar-blam>
                </repeat-blam>
                <bar-blam s="0 ? 0 ? ? ? ? ?" chance="1"></bar-blam>
            </track-blam>

            <track-blam id="snareSoftTrack" to="#snareSoft" chance="0.6">
                <bar-blam s="0 0 0 0 0 0 ? 0 0 0 ?"></bar-blam>
                <bar-blam s="0 0 0 0 0 0 0 ? ? ?"></bar-blam>
            </track-blam>
        </sequencer-blam>

        <!-- Scribe Multi-Part Visualiser: scores both Bass and Drums in a single score -->
        <scribe-hyperblam from="#transport" parts="bass drums" key="C" meter="4/4" bars="2"></scribe-hyperblam>
    </audio-blam>
</body>
</html>
