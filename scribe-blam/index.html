<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Scribe visualiser for Hyperblam</title>

    <link rel="stylesheet" href="./element.css" />

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #111417;
            color: #e5e9f0;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        p {
            color: #8892b0;
            margin: 0;
        }

        .controls {
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background: #e06c75;
            color: #fff;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        button:hover {
            background: #be5059;
        }

        button:active {
            transform: scale(0.98);
        }

        audio-blam {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        scribe-hyperblam {
            box-sizing: border-box;
            width: 100%;
            min-height: 180px;
            background: #ffffff;
            color: #000000;
            border-radius: 8px;
            padding: 1.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 1rem;
        }
    </style>

    <script type="importmap">{
        "imports": {
            "bolt/":      "https://cdn.jsdelivr.net/gh/stephband/bolt-2@1.0.9/",
            "dom/":       "https://cdn.jsdelivr.net/gh/stephband/dom@1.4.9/modules/",
            "fn/":        "https://cdn.jsdelivr.net/gh/stephband/fn@1.6.8/modules/",
            "midi/":      "https://cdn.jsdelivr.net/gh/stephband/midi@1.1.5/modules/",
            "neuron/":    "https://cdn.jsdelivr.net/gh/stephband/neuron@0.1.1/",
            "sequence/":  "https://cdn.jsdelivr.net/gh/soundio/sequence@0.4.7/",
            "hyperblam/": "https://hyperblam.how/static/hyperblam/dist/hyperblam/"
        }
    }</script>

    <!-- Import ScribeHyperblam and Hyperblam -->
    <script type="module">
        import './module.js';
        import 'hyperblam/hyperblam.js';

        // Transport management belongs strictly to page/controller scripts, not visualisers
        const clock = document.querySelector('sequencer-blam');
        const playBtn = document.getElementById('play-btn');

        clock?.addEventListener('blamplay', () => {
            if (playBtn) playBtn.textContent = 'Stop';
        });

        clock?.addEventListener('blamstop', () => {
            if (playBtn) playBtn.textContent = 'Play';
            document.querySelectorAll('synth-blam, note-blam, sampler-blam').forEach(s => s.stop?.());
        });

        playBtn?.addEventListener('click', () => {
            clock?.playStop?.();
        });
    </script>
</head>

<body>
    <header>
        <h1>&lt;scribe-hyperblam&gt;</h1>
    </header>

    <div class="controls">
        <button type="button" id="play-btn">Play</button>
    </div>

    <audio-blam bpm="120">
        <sequencer-blam id="clock" scale="1">
            <track-blam id="lead" to="#synth">
                <bar-blam s="C4 0 E4 0 G4 0 B4 0 A4 0 G4 0 E4 0 C4 0"></bar-blam>
                <bar-blam s="D4 0 F4 0 A4 0 C5 0 B4 0 0 0 0 0 0 0"></bar-blam>
            </track-blam>
        </sequencer-blam>

        <synth-blam id="synth" gain="0.3">
            <carrier-blam type="sawtooth" curve="0 0, 1 0.01, 0.7 0.2, 0 0.4"></carrier-blam>
        </synth-blam>

        <scribe-hyperblam from="#lead" staff="treble" key="C" meter="4/4" bars="2"></scribe-hyperblam>
    </audio-blam>
</body>
</html>
